[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-spark-paper"
version = "1.0.0"
description = "Reproducibility artifact for PRISM two-stage Spark SQL executor allocation"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "PRISM authors"}]

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
"prism.model" = ["baseline_models/*.joblib", "baseline_models/*.json", "initial_training/*.joblib", "initial_training/*.json", "expanded_training/*.joblib", "expanded_training/*.json", "expanded_training/*.csv"]
