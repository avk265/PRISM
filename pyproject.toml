[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-spark-sql"
version = "1.0.0"
description = "Two-stage predictive resource allocation and evaluation for Spark SQL"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
"prism.model" = ["baseline_models/*.joblib", "baseline_models/*.json", "initial_training/*.joblib", "initial_training/*.json", "expanded_training/*.joblib", "expanded_training/*.json", "expanded_training/*.csv"]
